name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet build -c Release -p:Version=$VERSION
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/Testcontainers.MiniStack -c Release --no-build -p:Version=$VERSION -o artifacts
      # Trusted publishing: exchanges the GitHub OIDC token for a short-lived nuget.org API key.
      - uses: NuGet/login@v1
        id: login
        with:
          user: kharabasz
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
